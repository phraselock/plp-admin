ca.cert=./certs/CA/smartcard/ca.crt

domain=ad.phraselock.test

# Default domain for UPN (overridable per user)
card.domain=ad.phraselock.test

# Certificate type: rsa or ecc
card.cert.type=rsa

# Key size: RSA=2048/3072/4096, ECC=256/384
card.cert.bits=2048

# CRL distribution point URL (leave blank to omit)
card.crl.url=

# Where plp-admin writes the CRL (DER). A PEM copy is written next to it as <file>.pem;
# the Samba KDC reads that one via pkinit_revoke. Leave blank to disable CRL generation.
card.crl.file=./certs/CA/smartcard/crl/plc-test-ca.crl

# Enrollment token shown as QR code in the admin UI
# Default validity in minutes (can be overridden per QR code in the UI)
card.token.ttl.minutes=15
