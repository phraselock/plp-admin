# The CA that signs the cards, both files named explicitly.
# Single CA (ca-create.sh):  root-ca.crt / root-ca.key
# With intermediate:         intermediate-ca.crt / intermediate-ca.key
ca.cert=./certs/CA/smartcard/intermediate-ca.crt
ca.key=./certs/CA/smartcard/intermediate-ca.key

# Optional: certificates above ca.cert (intermediate + root, e.g. ca-chain.pem from
# ca-create-intermediate.sh). They are added to the PKCS#12. Leave blank without intermediate.
ca.chain=./certs/CA/smartcard/ca-chain.pem

# Default domain for UPN (username@domain), overridable per user. Set it to the domain
# of your Active Directory; the pre-fill in the admin UI stays empty otherwise.
card.domain=

# Certificate type: rsa or ecc
card.cert.type=rsa

# Key size: RSA=2048/3072/4096, ECC=256/384
card.cert.bits=2048

# CRL distribution point URL (leave blank to omit)
card.crl.url=

# Where plp-admin writes the CRL (DER). A PEM copy is written next to it as <file>.pem;
# the Samba KDC reads that one via pkinit_revoke. Leave blank to disable CRL generation.
card.crl.file=/var/www/plc-crl/intermediate-ca.crl

# Enrollment token shown as QR code in the admin UI
# Default validity in minutes (can be overridden per QR code in the UI)
card.token.ttl.minutes=15

# true: a QR token works for exactly one successful delivery to a phone;
# false: it can be used again until it expires (handy for testing)
card.token.singleuse=false

# true: the card's private key is deleted from smartcard-users.db once it has been
# delivered to the phone, so it then exists only in the phone's keystore. QR code and
# P12 are no longer available for that certificate; a new phone needs a new certificate.
# Note: deleted on delivery, not on a confirmation from the phone - if the import on the
# phone fails, issue a new certificate.
card.key.delete.after.enrollment=false
