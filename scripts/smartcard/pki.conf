# SmartCard PKI configuration
# Copy this file and adapt it to your environment before running the scripts.
# Source it or pass it as an argument:  . ./pki.conf && ./ca-create.sh
#
# The CA is created once with ca-create.sh; all subsequent operations use the
# same CA_DIR.  ca-issue-kdc.sh is a lab tool only — in a real domain the
# domain controller already has a KDC certificate from the Microsoft enterprise CA.

# ---------- CA ------------------------------------------------------------------

# Directory that will hold (or already holds) ca.crt, ca.key, ca.cnf, db/
CA_DIR=./ca

# Key type for the CA itself: rsa (default) or ec
CA_TYPE=rsa

# ---------- Card certificates ---------------------------------------------------

# Default key type for card certificates: 2048 | 3072 | 4096 | ecc
# ECC (P-256) requires keyAgreement for the OpenSC minidriver;
# the Windows inbox minidriver does not support ECC cards.
CARD_BITS=3072

# Password for exported .p12 files
CARD_P12_PASSWORD=changeit

# UPN suffix / AD domain (used to build the full UPN: username@CARD_DOMAIN)
CARD_DOMAIN=ad.example.com

# URL where plc-test-ca.crl is published (needed by Windows for revocation checks)
CRL_URL=http://pki.example.com/plc-test-ca.crl

# ---------- KDC certificate (lab only) -----------------------------------------

# FQDN of the domain controller
DC_FQDN=dc.ad.example.com

# Kerberos realm (usually the domain in uppercase)
REALM=AD.EXAMPLE.COM

# AD domain (lowercase)
DOMAIN=ad.example.com
