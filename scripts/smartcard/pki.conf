# SmartCard PKI configuration
# Edit the values below, then pass this file to every script as its first argument:
#   ./ca-create.sh pki.conf
#   ./ca-create-intermediate.sh pki.conf
#   ./ca-issue-kdc.sh pki.conf
#
# ca-issue-kdc.sh is a lab tool only — in a real domain the domain controller
# already has a KDC certificate from the Microsoft enterprise CA.

# ---------- Root CA (ca-create.sh) ----------------------------------------------

# Folder in which the root is created (root-ca.crt, root-ca.key, ca.cnf, db/)
ROOT_DIR=./root

# Name of the root (CN; cannot be changed afterwards). Use a name that differs from
# any older CA, so the two cannot be mixed up in the Windows stores.
ROOT_CN="PhraseLock Office Root CA-2"

# Key type of the CAs: rsa or ec
CA_TYPE=rsa

# ---------- Intermediate CA (ca-create-intermediate.sh) -------------------------

# Folder in which the intermediate is created
# (intermediate-ca.crt, intermediate-ca.key, ca-chain.pem, root-ca.crt, ca.cnf, db/)
INTERMEDIATE_DIR=./intermediate
INTERMEDIATE_CN="PhraseLock Office Intermediate CA"

# URL of the root's CRL, written into the intermediate certificate so that Windows can
# check the intermediate itself (leave empty to omit)
ROOT_CRL_URL=http://hmx.ad.office.phraselock.info/root-ca.crl

# ---------- The CA that issues cards and the KDC certificate --------------------

# Its folder (holds ca.cnf and db/) and its two files, named explicitly (relative to CA_DIR).
# With intermediate:  CA_DIR=./intermediate  intermediate-ca.crt / intermediate-ca.key
# Without:            CA_DIR=./root          root-ca.crt / root-ca.key
CA_DIR=./intermediate
CA_CRT=intermediate-ca.crt
CA_KEY=intermediate-ca.key

# URL where the CRL of the issuing CA (intermediate-ca.crl, or root-ca.crl without intermediate) is published; Windows checks the KDC
# certificate with it. Cards are issued by plp-admin (smartcard.properties), not by a script here.
CRL_URL=http://hmx.ad.office.phraselock.info/intermediate-ca.crl

# ---------- KDC certificate (lab only) -----------------------------------------

# FQDN of the domain controller
DC_FQDN=hmx.ad.office.phraselock.info

# Kerberos realm (usually the domain in uppercase)
REALM=AD.OFFICE.PHRASELOCK.INFO

# AD domain (lowercase)
DOMAIN=ad.office.phraselock.info

