plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'plp'
version = '1.0.2'

repositories {
    mavenCentral()
}

application {
    mainClass = 'plp.admin.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

dependencies {
    // Web framework
    implementation "io.javalin:javalin:7.2.2"
    implementation "org.slf4j:slf4j-simple:2.0.17"

    // JSON / XML
    implementation "com.fasterxml.jackson.core:jackson-databind:2.21.1"
    implementation "org.json:json:20250107"
    implementation "xmlpull:xmlpull:1.1.3.1"

    // Admin UI
    implementation "com.j2html:j2html:1.6.0"

    // SQLite (SmartCardUserStore, KeePassUserStore, peer-config)
    implementation "org.xerial:sqlite-jdbc:3.51.2.0"

    // MQTT
    implementation "org.eclipse.paho:org.eclipse.paho.mqttv5.client:1.2.5"

    // X.509 / PKCS12 certificate issuance (ClientCert + SmartCard)
    implementation "org.bouncycastle:bcpkix-jdk18on:1.79"
    implementation "org.bouncycastle:bcprov-jdk18on:1.79"

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // KeePass KDBX4
    implementation 'org.linguafranca.pwdb:KeePassJava2:2.2.4'
    implementation 'org.linguafranca.pwdb:KeePassJava2-kdbx:2.2.4'

    // QR code generation
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    // Psono NaCl crypto
    implementation 'com.goterl:lazysodium-java:5.1.4'
    implementation 'net.java.dev.jna:jna:5.14.0'

    // Redis (peer-config backend)
    implementation 'redis.clients:jedis:5.1.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

shadowJar {
    archiveBaseName.set('plp-admin')
    archiveVersion.set('1.0.2')
    archiveClassifier.set('')
    mergeServiceFiles()
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}
